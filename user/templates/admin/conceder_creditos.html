{% extends "admin/base_site.html" %}

{% block content %}
<form method="post">
  {% csrf_token %}
  <p>Você está concedendo créditos para {{ users|length }} usuário(s):</p>
  <ul>
    {% for user in users %}
      <li>{{ user }} (saldo atual: {{ user.lance_credits }})</li>
      <input type="hidden" name="_selected_action" value="{{ user.pk }}">
    {% endfor %}
  </ul>

  {{ form.as_p }}

  <input type="hidden" name="action" value="conceder_creditos">
  <input type="submit" name="apply" value="Conceder créditos">
</form>
{% endblock %}
